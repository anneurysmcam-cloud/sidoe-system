[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --timeout=60 -p no:warnings
markers =
    requiere_bd_local: requiere una copia local de sidoe.db con datos migrados reales (excluido del CI, que corre sobre un esquema vacío recién inicializado)
