# requirements.lock
# ==================
# Snapshot de versiones EXACTAS (directas + transitivas) resueltas a partir
# de requirements.txt, para instalación reproducible en producción.
#
# requirements.txt sigue siendo la fuente declarativa (qué necesita el
# proyecto, sin pines) — mismo criterio que se usó para pinear `ruff` en
# requirements-dev.txt: sin versiones exactas, un mismo código puede
# comportarse distinto entre instalaciones solo por una dependencia nueva
# instalada en momentos distintos.
#
# Uso:
#   pip install -r requirements.lock
#
# Regeneración (deliberada, no automática — re-validar test suite completa
# tras cualquier bump):
#   python3 -m venv /tmp/venv_lock && source /tmp/venv_lock/bin/activate
#   pip install -r requirements.txt
